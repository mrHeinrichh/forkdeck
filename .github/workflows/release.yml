name: Desktop release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:workspace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure
          path: |
            output/ui-checks/
            output/workspace-ui-checks/
          if-no-files-found: ignore

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            executable: dist/mac-arm64/ForkDeck.app/Contents/MacOS/ForkDeck
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: dist/mac/ForkDeck.app/Contents/MacOS/ForkDeck
          - os: windows-latest
            platform: win
            arch: x64
            executable: dist/win-unpacked/ForkDeck.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build native installers
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Launch and verify packaged app
        run: node scripts/smoke-desktop.js "${{ matrix.executable }}"
      - name: Verify macOS signatures and Finder startup from downloads
        if: matrix.platform == 'mac'
        run: node scripts/verify-macos.js ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: forkdeck-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify version and create checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
          cd release-assets
          sha256sum ForkDeck-* > SHA256SUMS.txt
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "ForkDeck $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
